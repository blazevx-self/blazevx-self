<svg xmlns="http://www.w3.org/2000/svg" width="860" height="112" viewBox="0 0 860 112" role="presentation">
  <!-- monochrome journey timeline: past solid, now ringed, future dashed -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="70" y1="56" x2="640" y2="56" stroke="#8b949e" stroke-width="2"/>
    <line x1="640" y1="56" x2="800" y2="56" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>

    <circle cx="70"  cy="56" r="6" fill="#e6edf3"/>
    <circle cx="260" cy="56" r="6" fill="#e6edf3"/>
    <circle cx="450" cy="56" r="6" fill="#e6edf3"/>
    <circle cx="640" cy="56" r="9" fill="none" stroke="#e6edf3" stroke-width="2"/>
    <circle cx="640" cy="56" r="3.5" fill="#e6edf3"/>
    <circle cx="800" cy="56" r="6" fill="#0d1117" stroke="#8b949e" stroke-width="2"/>

    <g fill="#e6edf3" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">
      <text x="70"  y="32">FEB 2026</text>
      <text x="260" y="32">2026</text>
      <text x="450" y="32">NOV 2026</text>
      <text x="640" y="32">NOW</text>
      <text x="800" y="32">2027</text>
    </g>

    <g fill="#8b949e" font-size="11" text-anchor="middle">
      <text x="70"  y="82">first python lines</text>
      <text x="70"  y="98">basics in a month</text>
      <text x="260" y="82">BlaZe in production</text>
      <text x="260" y="98">first production deploy</text>
      <text x="450" y="82">Self Music completed</text>
      <text x="450" y="98">practice project</text>
      <text x="640" y="82">BlaZe-Desk in progress</text>
      <text x="640" y="98">channel control bot</text>
      <text x="800" y="82">web app &amp; messenger</text>
      <text x="800" y="98">team project</text>
    </g>
  </g>
</svg>
