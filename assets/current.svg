<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="presentation">
  <!-- monochrome "currently shipping" widget with live clock -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="1" y="1" width="858" height="148" rx="12" fill="#0d1117" stroke="#30363d"/>

    <circle cx="34" cy="34" r="5" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="52" y="39" fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="12">currently shipping</text>
    <text x="826" y="39" text-anchor="end" fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="12">vps time <tspan id="clock" fill="#e6edf3">--:--:--</tspan></text>
    <line x1="1" y1="52" x2="859" y2="52" stroke="#30363d"/>

    <text x="34" y="86" fill="#e6edf3" font-size="19" font-weight="600">BlaZe-Desk</text>
    <text x="34" y="108" fill="#8b949e" font-size="12">a bot that runs my Telegram channel: draft posts, edit &amp; schedule them, run polls,</text>
    <text x="34" y="126" fill="#8b949e" font-size="12">answer anonymous messages, handle join requests and report channel stats on my own schedule</text>

    <rect x="640" y="72" width="186" height="10" rx="5" fill="#161b22" stroke="#30363d"/>
    <rect x="642" y="74" width="64" height="6" rx="3" fill="#8b949e"/>
    <text x="640" y="102" fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="11">in progress · concept → mvp</text>
  </g>

  <script type="application/ecmascript"><![CDATA[
    (function () {
      var t = document.getElementById('clock');
      if (!t) return;
      function tick() {
        var d = new Date();
        function p(n) { return (n < 10 ? '0' : '') + n; }
        t.textContent = p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
      }
      tick();
      setInterval(tick, 1000);
    })();
  ]]></script>
</svg>
