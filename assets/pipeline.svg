<svg xmlns="http://www.w3.org/2000/svg" width="860" height="104" viewBox="0 0 860 104" role="presentation">
  <!-- monochrome request-flow diagram: routers -> services -> repositories -> db -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="30"  y="20" width="180" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="236" y="20" width="180" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="442" y="20" width="180" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="648" y="20" width="180" height="64" rx="10" fill="#161b22" stroke="#30363d"/>

    <g stroke="#8b949e" stroke-width="1.5" fill="#8b949e">
      <line x1="213" y1="52" x2="228" y2="52"/><polygon points="228,48 228,56 234,52" stroke="none"/>
      <line x1="419" y1="52" x2="434" y2="52"/><polygon points="434,48 434,56 440,52" stroke="none"/>
      <line x1="625" y1="52" x2="640" y2="52"/><polygon points="640,48 640,56 646,52" stroke="none"/>
    </g>

    <text x="120" y="47" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">routers</text>
    <text x="120" y="66" text-anchor="middle" fill="#8b949e" font-size="11">aiogram handlers</text>
    <text x="326" y="47" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">services</text>
    <text x="326" y="66" text-anchor="middle" fill="#8b949e" font-size="11">typed results</text>
    <text x="532" y="47" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">repositories</text>
    <text x="532" y="66" text-anchor="middle" fill="#8b949e" font-size="11">SQLAlchemy async</text>
    <text x="738" y="47" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">PostgreSQL</text>
    <text x="738" y="66" text-anchor="middle" fill="#8b949e" font-size="11">JSONB &amp; migrations</text>
  </g>
</svg>
